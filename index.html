function printCurrentView(){
  const meta = document.getElementById("printMeta");
  if(meta){
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,"0");
    const mm = String(now.getMonth()+1).padStart(2,"0");
    const hh = String(now.getHours()).padStart(2,"0");
    const mi = String(now.getMinutes()).padStart(2,"0");
    meta.textContent = "Dicetak: "+DAYS_ID[now.getDay()]+", "+dd+"/"+mm+"/"+now.getFullYear()+" "+hh+":"+mi;
  }
  window.print();
}

// ==========================================================================
// EVENT DELEGATION
// ==========================================================================
document.body.addEventListener("click", function(e){
  // Klik langsung pada backdrop (bukan pada isi kartu di dalamnya) menutup modal/lightbox.
  if(e.target.classList && (e.target.classList.contains("modal-overlay") || e.target.classList.contains("photo-lightbox-overlay"))){
    closeModal();
    return;
  }
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case "nav-dashboard": renderDashboard(); closeSidebarMobile(); break;
    case "nav-table": renderTableView(el.dataset.table); closeSidebarMobile(); break;
    case "toggle-group": toggleGroup(el.dataset.group); break;
    case "refresh": loadAll().then(()=>{ if(STATE.view==="dashboard") renderDashboard(); else renderTableView(STATE.currentTable); toast("Data diperbarui","success"); }); break;
    case "add-record": openRecordModal(el.dataset.table, null); break;
    case "edit-record": openRecordModal(el.dataset.table, el.dataset.key); break;
    case "delete-record": confirmDelete(el.dataset.table, el.dataset.key); break;
    case "export-csv": exportCSV(el.dataset.table); break;
    case "close-modal": closeModal(); break;
    case "save-record": saveRecord(el.dataset.table, el.dataset.key||null); break;
    case "view-photo": openPhotoLightbox(el.dataset.img); break;
    case "view-detail": {
      if(e.target.closest("a")) break;                                   /* tautan file jangan memicu detail */
      if(window.getSelection && String(window.getSelection())) break;    /* sedang menyalin teks, bukan klik */
      openDetailModal(el.dataset.table, el.dataset.key, el.dataset.idx); break;
    }
    case "toggle-cols": STATE.fullCols[el.dataset.table] = !STATE.fullCols[el.dataset.table]; renderTableView(el.dataset.table); break;
    case "print-view": printCurrentView(); break;
    case "logout": logout(); break;
    case "open-sidebar": document.getElementById("sidebar").classList.add("open"); document.querySelector(".sidebar-backdrop").classList.add("show"); break;
    case "close-sidebar": closeSidebarMobile(); break;
  }
});
document.addEventListener("keydown", function(e){
  /* Esc menutup detail/foto saja; form edit tidak ikut tertutup agar isian tidak hilang tak sengaja */
  if(e.key==="Escape" && $modalRoot.querySelector(".modal-detail, .photo-lightbox-overlay")) closeModal();
});
function closeSidebarMobile(){
  document.getElementById("sidebar").classList.remove("open");
  const b = document.querySelector(".sidebar-backdrop"); if(b) b.classList.remove("show");
}

// LIVE CLOCK
// ==========================================================================
function startClock(){
  updateClock();
  setInterval(updateClock, 1000);
}
function updateClock(){
  const el = document.getElementById("liveClock");
  if(!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  el.textContent = DAYS_ID[now.getDay()]+", "+now.getDate()+" "+MONTHS_ID[now.getMonth()]+" "+now.getFullYear()+" · "+hh+":"+mm+":"+ss;
}

// ==========================================================================
// INIT
// ==========================================================================
function init(){
  startClock();
  renderLoginScreen("loading");
  loadAll(true).then(()=>{
    if(!STATE.lastSync){ renderLoginScreen("error"); return; }
    resumeAfterLoad();
  });
  initFxLayer();
}

function initFxLayer(){
  const SPOT_SELECTOR = ".glass, .btn, .icon-btn, .kpi-card, .quick-chip";
  document.addEventListener("pointermove", function(e){
    const el = e.target.closest(SPOT_SELECTOR);
    if(!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100)+"%");
    el.style.setProperty("--my", ((e.clientY-r.top)/r.height*100)+"%");
  }, {passive:true});

  const RIPPLE_SELECTOR = ".btn, .icon-btn, .kpi-card, .quick-chip, .nav-item";
  document.addEventListener("pointerdown", function(e){
    const el = e.target.closest(RIPPLE_SELECTOR);
    if(!el) return;
    const r = el.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 1.8;
    const span = document.createElement("span");
    span.className = "ripple-fx";
    span.style.width = span.style.height = size+"px";
    span.style.left = (e.clientX - r.left - size/2)+"px";
    span.style.top = (e.clientY - r.top - size/2)+"px";
    el.appendChild(span);
    span.addEventListener("animationend", ()=>span.remove());
  }, {passive:true});
}
document.addEventListener("DOMContentLoaded", init);
