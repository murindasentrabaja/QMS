<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#F2F6FC">
<title>QMS ISO 9001 · PT Murinda Sentra Baja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js" defer></script>
<style>
:root{
  --bg-base:#F2F6FC; --bg-elevated:#FFFFFF;
  --glass-bg:rgba(255,255,255,.60); --glass-bg-strong:rgba(255,255,255,.82);
  --glass-border:rgba(255,255,255,.65); --glass-highlight:rgba(255,255,255,.95);

  --cyan:#2563EB;    --cyan-dim:rgba(37,99,235,.14);
  --amber:#F97316;   --amber-dim:rgba(249,115,22,.15);
  --rose:#EC4899;    --rose-dim:rgba(236,72,153,.14);
  --emerald:#10B981; --emerald-dim:rgba(16,185,129,.15);
  --indigo:#8B5CF6;  --indigo-dim:rgba(139,92,246,.14);
  --slate:#64748B;   --slate-dim:rgba(100,116,139,.12);

  --text-1:#0F172A; --text-2:#51607A; --text-3:#8996AC;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --font:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font); color:var(--text-1); min-height:100vh;
  background:var(--bg-base);
  background-attachment:fixed;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:""; position:fixed; inset:-12% -8%; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%, rgba(16,185,129,.40), transparent 38%),
    radial-gradient(circle at 85% 10%, rgba(37,99,235,.36), transparent 38%),
    radial-gradient(circle at 88% 78%, rgba(139,92,246,.32), transparent 40%),
    radial-gradient(circle at 15% 85%, rgba(249,115,22,.28), transparent 38%),
    radial-gradient(circle at 52% 48%, rgba(236,72,153,.20), transparent 45%);
  filter:blur(60px) saturate(150%);
  animation:liquidDrift 24s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes liquidDrift{
  0%{ transform:translate3d(0,0,0) scale(1) rotate(0deg); }
  50%{ transform:translate3d(-2.5%,2%,0) scale(1.07) rotate(4deg); }
  100%{ transform:translate3d(2.5%,-2%,0) scale(1) rotate(-3deg); }
}
.grid-overlay{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:
    linear-gradient(rgba(15,23,42,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 30% 0%, #000 0%, transparent 70%);
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:rgba(37,99,235,.22); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(37,99,235,.4);}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.glass{
  position:relative; isolation:isolate; overflow:hidden;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  border-radius:var(--r-lg); backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 0 var(--glass-highlight), inset 0 0 0 1px rgba(255,255,255,.4), 0 12px 32px -10px rgba(30,41,68,.18);
  transition:box-shadow .25s ease, transform .25s ease;
}
.glass::before{
  content:""; position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.8), transparent 62%);
  mix-blend-mode:soft-light; transition:opacity .35s ease;
}
.glass:hover::before{ opacity:1; }

#app{position:relative; z-index:1; display:grid; grid-template-columns:280px 1fr; min-height:100vh;}
#sidebar{
  margin:14px 0 14px 14px; padding:18px 14px; display:flex; flex-direction:column; gap:14px;
  height:calc(100vh - 28px); position:sticky; top:14px; overflow-y:auto;
}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:6px 6px 16px; border-bottom:1px solid var(--glass-border);}
.brand-mark{
  width:100%; height:40px; display:flex; align-items:center; justify-content:flex-start; flex:none;
}
.brand-mark img{height:100%; width:auto; max-width:100%; object-fit:contain;}
.brand-text{display:flex; flex-direction:column; align-items:flex-start; text-align:left;}
.brand-title{font-weight:800; font-size:.92rem; letter-spacing:.01em;}
.brand-sub{font-size:.72rem; color:var(--text-3); margin-top:1px;}

.sidebar-search{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.55);
  border:1px solid var(--glass-border); border-radius:var(--r-sm); padding:8px 10px;
}
.sidebar-search svg{width:15px; height:15px; color:var(--text-3); flex:none;}
.sidebar-search input{background:none; border:none; color:var(--text-1); font-family:var(--font); font-size:.8rem; width:100%; outline:none;}
.sidebar-search input::placeholder{color:var(--text-3);}

.nav-item{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  color:var(--text-2); font-family:var(--font); font-size:.83rem; font-weight:600; padding:9px 10px;
  border-radius:var(--r-sm); cursor:pointer; transition:background .15s, color .15s;
}
.nav-item svg{width:16px; height:16px; flex:none;}
.nav-item:hover{background:rgba(37,99,235,.08); color:var(--text-1);}
.nav-item.active{background:linear-gradient(135deg, var(--cyan-dim), var(--indigo-dim)); color:var(--cyan); box-shadow:inset 0 0 0 1px rgba(37,99,235,.18);}
#navGroups{display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1;}
.nav-group-header{
  display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none;
  color:var(--text-2); font-family:var(--font); font-size:.71rem; font-weight:700; letter-spacing:.01em;
  padding:10px 10px 6px; cursor:pointer;
}
.nav-group-label{display:flex; align-items:center; gap:8px;}
.group-icon-chip{
  width:22px; height:22px; border-radius:7px; flex:none; color:#fff;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.15), 0 3px 8px -2px var(--chip-shadow, rgba(37,99,235,.5));
}
.group-icon-chip svg{width:12px; height:12px;}
.accent-blue{ background:linear-gradient(135deg, var(--cyan), #60A5FA); --chip-shadow:rgba(37,99,235,.55); }
.accent-purple{ background:linear-gradient(135deg, var(--indigo), #C4B5FD); --chip-shadow:rgba(139,92,246,.55); }
.accent-pink{ background:linear-gradient(135deg, var(--rose), #F9A8D4); --chip-shadow:rgba(236,72,153,.55); }
.accent-orange{ background:linear-gradient(135deg, var(--amber), #FDBA74); --chip-shadow:rgba(249,115,22,.55); }
.accent-green{ background:linear-gradient(135deg, var(--emerald), #6EE7B7); --chip-shadow:rgba(16,185,129,.55); }
.nav-group-header .chev{width:13px; height:13px; transition:transform .2s; color:var(--text-3);}
.nav-group.open .chev{transform:rotate(180deg);}
.nav-group-items{max-height:0; overflow:hidden; transition:max-height .25s ease; display:flex; flex-direction:column; gap:1px;}
.nav-group.open .nav-group-items{max-height:600px;}
.nav-subitem{font-size:.78rem; font-weight:500; padding-left:22px;}

#main{display:flex; flex-direction:column; min-height:100vh; padding:14px 14px 14px 0; min-width:0;}
#topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 20px; margin-bottom:14px;
  position:sticky; top:14px; z-index:20;
}
.topbar-title{font-weight:700; font-size:.95rem;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
#menuToggle{display:none;}

.sync-pill{
  display:flex; align-items:center; gap:7px; font-size:.74rem; color:var(--text-2); font-weight:600;
  background:rgba(255,255,255,.55); border:1px solid var(--glass-border); padding:6px 12px; border-radius:999px;
}
.sync-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--slate); flex:none;}
.sync-pill.sync-ok .dot{background:var(--emerald); box-shadow:0 0 0 0 rgba(16,185,129,.5); animation:pulse 2s infinite;}
.sync-pill.sync-off .dot{background:var(--rose);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45);} 70%{box-shadow:0 0 0 6px rgba(16,185,129,0);} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}}

.btn{
  position:relative; overflow:hidden; isolation:isolate;
  display:inline-flex; align-items:center; gap:7px; font-family:var(--font); font-size:.8rem; font-weight:700;
  padding:9px 15px; border-radius:var(--r-sm); border:1px solid transparent; cursor:pointer; white-space:nowrap;
  transition:transform .12s, background .15s, border-color .15s, box-shadow .2s;
}
.btn svg{width:15px; height:15px;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg, var(--cyan), var(--indigo)); color:#fff; box-shadow:0 6px 18px -4px rgba(37,99,235,.45), inset 0 1px 1px rgba(255,255,255,.3);}
.btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 10px 22px -4px rgba(37,99,235,.55), inset 0 1px 1px rgba(255,255,255,.35);}
.btn-ghost{background:rgba(255,255,255,.55); border-color:var(--glass-border); color:var(--text-1);}
.btn-ghost:hover{background:rgba(255,255,255,.85); transform:translateY(-1px);}
.btn-danger{background:var(--rose-dim); border-color:rgba(236,72,153,.35); color:var(--rose);}
.btn-danger:hover{background:rgba(236,72,153,.24);}
.icon-btn{
  position:relative; overflow:hidden; isolation:isolate;
  display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:var(--r-sm);
  background:rgba(255,255,255,.55); border:1px solid var(--glass-border); color:var(--text-2); cursor:pointer;
  transition:background .15s, color .15s, transform .15s, box-shadow .2s;
}
.icon-btn svg{width:15px; height:15px;}
.icon-btn:hover{background:rgba(37,99,235,.1); color:var(--cyan); transform:translateY(-1px);}
.icon-btn-danger:hover{background:var(--rose-dim); color:var(--rose); border-color:rgba(236,72,153,.3);}
#topbar .icon-btn{background:linear-gradient(135deg, rgba(37,99,235,.14), rgba(139,92,246,.14)); border-color:rgba(37,99,235,.22); color:var(--cyan);}
#topbar .icon-btn:hover{background:linear-gradient(135deg, var(--cyan), var(--indigo)); color:#fff; box-shadow:0 8px 18px -6px rgba(37,99,235,.6); transform:translateY(-2px);}

#content{flex:1; display:flex; flex-direction:column; gap:18px; padding:0 6px 20px; min-width:0;}
.view-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.breadcrumb{font-size:.72rem; font-weight:700; color:var(--cyan); letter-spacing:.02em; margin-bottom:4px;}
.view-header h1{font-size:1.5rem; font-weight:800; letter-spacing:-.01em;}
.view-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.search-box{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.55); border:1px solid var(--glass-border);
  border-radius:var(--r-sm); padding:8px 12px; min-width:220px;
}
.search-box svg{width:15px; height:15px; color:var(--text-3); flex:none;}
.search-box input{background:none; border:none; outline:none; color:var(--text-1); font-family:var(--font); font-size:.82rem; width:100%;}

/* Dashboard */
.dash-grid{display:grid; grid-template-columns:300px 1fr; gap:16px;}
.hero-gauge{padding:26px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;}
.gauge-wrap{width:180px; height:180px; position:relative; margin-bottom:6px;}
.gauge-wrap svg{width:100%; height:100%;}
.gauge-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-score{font-size:2.1rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
.gauge-score-sub{font-size:.65rem; color:var(--text-3); margin-top:3px; font-weight:700; letter-spacing:.03em;}
.gauge-label{font-weight:700; font-size:.88rem; margin-top:6px;}
.gauge-sub{font-size:.72rem; color:var(--text-3);}
.quick-links{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px;}
.quick-chip{
  position:relative; overflow:hidden; isolation:isolate;
  font-size:.7rem; font-weight:700; padding:6px 11px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.55); border:1px solid var(--glass-border); color:var(--text-2);
  transition:background .15s, color .15s, transform .15s;
}
.quick-chip:hover{background:linear-gradient(135deg,var(--cyan),var(--indigo)); color:#fff; transform:translateY(-1px);}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(168px,1fr)); gap:12px;}
.kpi-card{
  position:relative; overflow:hidden; isolation:isolate;
  padding:16px; border-radius:var(--r-md); cursor:pointer; background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  border-left:3px solid var(--slate); transition:transform .18s, background .15s, box-shadow .2s;
}
.kpi-card::before{
  content:""; position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.75), transparent 62%);
  mix-blend-mode:soft-light; transition:opacity .35s ease;
}
.kpi-card:hover::before{ opacity:1; }
.kpi-card:hover{transform:translateY(-3px); background:var(--glass-bg-strong); box-shadow:0 14px 28px -12px rgba(30,41,68,.28);}
.kpi-icon{
  width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  position:relative; color:#fff;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55), inset 0 -3px 5px rgba(0,0,0,.14), 0 6px 14px -4px var(--icon-shadow, rgba(37,99,235,.5));
}
.kpi-icon::before{
  content:""; position:absolute; inset:2px 2px 52% 2px; border-radius:8px 8px 30px 30px/8px 8px 16px 16px;
  background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events:none;
}
.kpi-icon svg{width:17px; height:17px; position:relative; z-index:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));}
.kpi-value{font-size:1.65rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; position:relative; z-index:1;}
.kpi-label{font-size:.72rem; color:var(--text-3); font-weight:600; margin-top:5px; position:relative; z-index:1;}
.kpi-rose{border-left-color:var(--rose);} .kpi-rose .kpi-icon{background:linear-gradient(135deg,var(--rose),#F9A8D4); --icon-shadow:rgba(236,72,153,.55);}
.kpi-amber{border-left-color:var(--amber);} .kpi-amber .kpi-icon{background:linear-gradient(135deg,var(--amber),#FDBA74); --icon-shadow:rgba(249,115,22,.55);}
.kpi-emerald{border-left-color:var(--emerald);} .kpi-emerald .kpi-icon{background:linear-gradient(135deg,var(--emerald),#6EE7B7); --icon-shadow:rgba(16,185,129,.55);}
.kpi-indigo{border-left-color:var(--indigo);} .kpi-indigo .kpi-icon{background:linear-gradient(135deg,var(--indigo),#C4B5FD); --icon-shadow:rgba(139,92,246,.55);}
.kpi-cyan{border-left-color:var(--cyan);} .kpi-cyan .kpi-icon{background:linear-gradient(135deg,var(--cyan),#93C5FD); --icon-shadow:rgba(37,99,235,.55);}

.chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.chart-card{padding:20px;}
.chart-card h3{font-size:.85rem; font-weight:700; margin-bottom:16px; color:var(--text-1); position:relative; z-index:1;}
.bar-row{display:grid; grid-template-columns:120px 1fr 32px; align-items:center; gap:10px; margin-bottom:11px; font-size:.74rem; position:relative; z-index:1;}
.bar-label{color:var(--text-2); font-weight:600;}
.bar-track{height:8px; border-radius:6px; background:rgba(15,23,42,.06); overflow:hidden;}
.bar-fill{height:100%; border-radius:6px; transition:width .5s ease;}
.bar-value{text-align:right; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-1);}
.chart-empty{color:var(--text-3); font-size:.78rem; padding:10px 0; position:relative; z-index:1;}

/* Table: lebar mengikuti isi kolom, bisa digeser; header & kolom pertama tetap terlihat */
.table-wrap{overflow:auto; max-height:calc(100vh - 220px); background:rgba(255,255,255,.78); -webkit-overflow-scrolling:touch;}
table{width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; font-size:.82rem;}
thead th{
  position:sticky; top:0; z-index:2; background:#F4F7FC; text-align:left; font-weight:700;
  color:var(--text-2); font-size:.72rem; letter-spacing:.01em; padding:12px 16px; white-space:nowrap;
  border-bottom:1px solid rgba(15,23,42,.12);
}
tbody td{padding:12px 16px; border-bottom:1px solid rgba(15,23,42,.06); color:var(--text-1); vertical-align:middle; background:transparent;}
tbody tr[data-action="view-detail"]{cursor:pointer;}
tbody tr:hover td{background:rgba(37,99,235,.05);}
tbody tr.row-overdue td:first-child{box-shadow:inset 3px 0 0 var(--rose);}

/* kolom pertama (identitas baris) dan kolom aksi menempel saat digeser */
th.c-sticky, td.c-sticky{position:sticky; left:0; border-right:1px solid rgba(15,23,42,.09);}
td.c-sticky{z-index:1; background:#FBFCFF; font-weight:700;}
th.c-sticky{z-index:4;}
th.col-actions, td.col-actions{position:sticky; right:0; border-left:1px solid rgba(15,23,42,.09);}
td.col-actions{z-index:1; background:#FBFCFF;}
th.col-actions{z-index:4;}
tbody tr:hover td.c-sticky, tbody tr:hover td.col-actions{background:#EEF3FC;}
.col-actions{white-space:nowrap; text-align:right;}
.col-actions .icon-btn{display:inline-flex;}

/* sel: teks panjang dipotong 2 baris (isi lengkap ada di detail) */
.c-num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.c-nowrap{white-space:nowrap;}
.cell-text, .cell-clamp{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  white-space:normal; line-height:1.45; overflow-wrap:anywhere;
}
.cell-text{max-width:240px;}
.cell-clamp{min-width:200px; max-width:320px;}
td.c-sticky .cell-text{max-width:180px;}
.cell-chips{min-width:140px; max-width:280px; white-space:normal;}
.cell-muted{color:var(--text-3);}
.empty-state{text-align:center; color:var(--text-3); padding:40px 20px !important; font-size:.85rem;}
.table-footer{font-size:.76rem; color:var(--text-2); padding:2px 6px; display:flex; flex-wrap:wrap; gap:4px 18px;}

.badge{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:.7rem; font-weight:700; white-space:nowrap;}
.badge-rose{background:var(--rose-dim); color:var(--rose);}
.badge-amber{background:var(--amber-dim); color:var(--amber);}
.badge-emerald{background:var(--emerald-dim); color:var(--emerald);}
.badge-indigo{background:var(--indigo-dim); color:var(--indigo);}
.badge-cyan{background:var(--cyan-dim); color:var(--cyan);}
.badge-slate{background:var(--slate-dim); color:var(--slate);}
.chip{display:inline-block; padding:2px 8px; margin:1px 3px 1px 0; border-radius:6px; background:rgba(15,23,42,.055); font-size:.68rem; color:var(--text-2);}
.file-link{display:inline-flex; align-items:center; gap:4px; color:var(--cyan); font-weight:700; font-size:.76rem; text-decoration:none;}
.file-link svg{width:13px; height:13px;}

/* Employee photo (table thumbnail + lightbox) */
.employee-photo-wrap{display:inline-block; position:relative; z-index:1;}
.employee-photo-wrap:hover, .employee-photo-wrap:focus-within{ z-index:8; }
.employee-photo{
  width:40px; height:40px; border-radius:50%; object-fit:cover; display:block; cursor:zoom-in;
  border:1px solid var(--glass-border); box-shadow:0 2px 6px rgba(0,0,0,.1);
  transition:transform .18s ease, box-shadow .18s ease; transform-origin:center;
}
.employee-photo:hover, .employee-photo:focus-visible{
  transform:scale(1.9); box-shadow:0 10px 26px -6px rgba(15,23,42,.4), 0 0 0 3px #fff, 0 0 0 4px var(--cyan);
}
.photo-lightbox-overlay{background:rgba(8,13,28,.78); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.photo-lightbox-card{
  position:relative; max-width:min(86vw,480px); max-height:86vh; animation:loginCardIn .3s cubic-bezier(.16,1,.3,1) both;
}
.photo-lightbox-card img{
  display:block; width:100%; height:100%; max-height:86vh; object-fit:contain; border-radius:var(--r-md);
  background:#fff; box-shadow:0 24px 60px -12px rgba(0,0,0,.5);
}
.photo-lightbox-close{
  position:absolute; top:-14px; right:-14px; background:#fff; color:var(--text-1);
  box-shadow:0 6px 18px -4px rgba(0,0,0,.35);
}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.35); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{width:100%; max-width:640px; max-height:88vh; display:flex; flex-direction:column;}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--glass-border); position:relative; z-index:1;}
.modal-header h2{font-size:1.02rem; font-weight:800;}
.modal-body{padding:20px 22px; overflow-y:auto; position:relative; z-index:1;}
.modal-footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--glass-border); position:relative; z-index:1;}
/* Modal detail (klik baris) */
.modal.modal-detail{max-width:760px; background:rgba(255,255,255,.95);}
.detail-head{align-items:flex-start; gap:14px;}
.detail-head-main{min-width:0; flex:1;}
.detail-head-main .breadcrumb{margin-bottom:3px;}
.modal-header h2.detail-title{
  font-size:1.12rem; line-height:1.35; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
}
.detail-badges{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px;}
.detail-id{font-size:.72rem; font-weight:700; color:var(--text-2); background:rgba(15,23,42,.06); padding:3px 10px; border-radius:999px;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:dense; gap:0 28px;}
.dv-item{padding:11px 0; border-bottom:1px solid rgba(15,23,42,.07); min-width:0;}
.dv-item.full{grid-column:1 / -1;}
.dv-label{font-size:.72rem; font-weight:700; color:var(--text-2); margin-bottom:4px;}
.dv-value{font-size:.88rem; line-height:1.5; overflow-wrap:anywhere;}
.dv-value .is-long{white-space:pre-wrap;}
.dv-value .cell-chips{min-width:0; max-width:none;}
.dv-empty{color:var(--text-3);}
.detail-photo .employee-photo{width:96px; height:96px; border-radius:16px; cursor:default;}
.detail-photo .employee-photo:hover{transform:none; box-shadow:0 2px 6px rgba(0,0,0,.1);}
.btn-push-left{margin-right:auto;}
#recordForm{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-group{display:flex; flex-direction:column; gap:6px;}
.form-group.full{grid-column:1 / -1;}
.form-group label{font-size:.74rem; font-weight:700; color:var(--text-2);}
.form-group label .req{color:var(--rose); margin-left:3px;}
.form-group input[type=text], .form-group input[type=email], .form-group input[type=number],
.form-group input[type=date], .form-group select, .form-group textarea{
  background:rgba(255,255,255,.7); border:1px solid var(--glass-border); border-radius:var(--r-sm);
  color:var(--text-1); font-family:var(--font); font-size:.83rem; padding:9px 11px; outline:none; width:100%;
  transition:border-color .15s, box-shadow .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(37,99,235,.15);}
.form-group input:disabled{opacity:.55; cursor:not-allowed;}
.form-group textarea{resize:vertical; min-height:64px;}
.form-group .hint{font-size:.68rem; color:var(--text-3);}
.checklist{display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:auto; background:rgba(255,255,255,.5); border:1px solid var(--glass-border); border-radius:var(--r-sm); padding:10px;}
.chk{display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--text-2); cursor:pointer;}
.chk input{accent-color:var(--cyan);}
.file-field{display:flex; flex-direction:column; gap:6px;}
.file-field input[type=file]{font-size:.75rem; color:var(--text-2);}
.file-link-existing{font-size:.72rem; color:var(--cyan); font-weight:700;}

/* Toast */
#toastRoot{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  display:flex; align-items:center; gap:9px; padding:12px 16px; border-radius:var(--r-md); font-size:.82rem; font-weight:600;
  background:rgba(255,255,255,.92); backdrop-filter:blur(14px); border:1px solid var(--glass-border); box-shadow:0 14px 34px -8px rgba(30,41,68,.28);
  opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; max-width:340px;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast svg{width:16px; height:16px; flex:none;}
.toast-success{border-color:rgba(16,185,129,.4);} .toast-success svg{color:var(--emerald);}
.toast-error{border-color:rgba(236,72,153,.4);} .toast-error svg{color:var(--rose);}
.toast-info svg{color:var(--cyan);}

.setup-banner{padding:16px 20px; display:flex; align-items:center; gap:14px; border-left:3px solid var(--amber);}
.setup-banner svg{width:20px; height:20px; color:var(--amber); flex:none; position:relative; z-index:1;}
.setup-banner p{font-size:.8rem; color:var(--text-2); position:relative; z-index:1;}
.setup-banner b{color:var(--text-1);}

.sidebar-backdrop{position:fixed; inset:0; z-index:55; display:none; background:rgba(15,23,42,.45);}
.sidebar-backdrop.show{display:block;}

.ripple-fx{
  position:absolute; border-radius:50%; z-index:6; pointer-events:none; transform:scale(0); opacity:.9;
  background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
  animation:rippleAnim .6s ease-out forwards;
}
@keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }

/* Live clock + user menu */
.live-clock{
  display:flex; align-items:center; font-size:.74rem; font-weight:700; color:var(--text-2); white-space:nowrap;
  background:rgba(255,255,255,.55); border:1px solid var(--glass-border); padding:6px 13px; border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.user-menu{display:flex; align-items:center; gap:8px;}
.user-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; color:var(--text-2);
  background:rgba(255,255,255,.55); border:1px solid var(--glass-border); padding:6px 12px; border-radius:999px; white-space:nowrap;
}
.user-badge svg{width:13px; height:13px;}
.user-badge-view{color:var(--amber); border-color:rgba(249,115,22,.3); background:var(--amber-dim);}
.print-only-brand{display:none;}

/* Login screen */
.login-overlay{
  position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center; padding:20px;
  background:
    radial-gradient(circle at 14% 16%, rgba(16,185,129,.20), transparent 40%),
    radial-gradient(circle at 88% 10%, rgba(37,99,235,.22), transparent 42%),
    radial-gradient(circle at 85% 85%, rgba(139,92,246,.18), transparent 45%),
    radial-gradient(circle at 12% 88%, rgba(249,115,22,.14), transparent 40%),
    linear-gradient(180deg, #F5F8FD, #E8EFFA);
  animation:loginOverlayIn .5s ease both;
}
@keyframes loginOverlayIn{ from{opacity:0;} to{opacity:1;} }
.login-card{
  width:100%; max-width:396px; text-align:center; position:relative; z-index:1; overflow:hidden;
  background:var(--glass-bg-strong);
  box-shadow:inset 0 1px 0 0 var(--glass-highlight), inset 0 0 0 1px rgba(255,255,255,.4), 0 24px 48px -16px rgba(30,41,68,.22);
  animation:loginCardIn .55s cubic-bezier(.16,1,.3,1) .08s both;
}
@keyframes loginCardIn{ from{opacity:0; transform:translateY(22px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
.login-card-band{height:5px; background:linear-gradient(90deg, var(--cyan), var(--indigo) 55%, var(--rose));}
.login-card-inner{padding:38px 34px 32px;}
.login-logo{
  height:56px; margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
}
.login-logo img{height:100%; width:auto; max-width:240px; object-fit:contain;}
.login-title{font-weight:800; font-size:1.2rem; margin-bottom:3px; letter-spacing:-.01em;}
.login-sub{font-size:.79rem; color:var(--text-3); margin-bottom:26px; font-weight:600;}
.login-form{display:flex; flex-direction:column; gap:13px; text-align:left;}
.login-field{position:relative; display:flex; align-items:center;}
.login-field > svg{position:absolute; left:12px; width:15px; height:15px; color:var(--text-3); pointer-events:none;}
.login-field input[type="text"], .login-field input[type="password"]{padding-left:36px; padding-right:36px; background:rgba(255,255,255,.85);}
.login-field .pw-toggle{
  position:absolute; right:6px; background:none; border:none; padding:6px; border-radius:8px;
  color:var(--text-3); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.login-field .pw-toggle svg{width:15px; height:15px;}
.login-field .pw-toggle:hover{background:rgba(37,99,235,.1); color:var(--cyan);}
.login-error{
  background:var(--rose-dim); color:var(--rose); font-size:.76rem; font-weight:600; padding:9px 12px;
  border-radius:var(--r-sm); display:none; margin-bottom:12px; text-align:left;
}
.login-error.show{display:block;}
.login-divider{display:flex; align-items:center; gap:10px; margin:20px 0 14px; color:var(--text-3); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.login-divider::before, .login-divider::after{content:""; flex:1; height:1px; background:var(--glass-border);}
.login-loading{font-size:.82rem; color:var(--text-3); padding:16px 0 4px; display:flex; flex-direction:column; align-items:center; gap:13px;}
.login-spinner{width:26px; height:26px; border-radius:50%; border:3px solid var(--cyan-dim); border-top-color:var(--cyan); animation:loginSpin .8s linear infinite;}
@keyframes loginSpin{to{transform:rotate(360deg);}}
.login-foot{margin-top:22px; font-size:.68rem; color:var(--text-3); font-weight:600;}

/* Print */
.print-only-meta{display:none;}
@media print{
  body::before, .grid-overlay, #sidebar, .sidebar-backdrop, #menuToggle, .user-menu,
  #syncIndicator, #liveClock, .view-actions, .col-actions,
  #modalRoot, #toastRoot, #loginRoot{ display:none !important; }
  #app{display:block;}
  #main{padding:0;}
  body{background:#fff;}
  #topbar{
    position:static; display:flex; align-items:center; justify-content:space-between;
    box-shadow:none; border:none; background:none; backdrop-filter:none;
    padding:0 0 14px; margin-bottom:18px; border-bottom:2px solid #0F172A;
  }
  .topbar-title{flex:1;}
  .screen-only-title{display:none !important;}
  .print-only-brand{display:flex !important; align-items:center; gap:12px;}
  .print-only-brand img{height:36px; width:auto; flex:none;}
  .print-only-brand-text{display:flex; flex-direction:column; gap:2px; line-height:1.3; text-align:left;}
  .print-only-brand-text strong{font-size:1rem; color:#0F172A; font-weight:800;}
  .print-only-brand-text span{font-size:.74rem; color:#51607A; font-weight:600;}
  .topbar-actions{display:flex;}
  .print-only-meta{display:block !important; font-size:.72rem; color:#51607A; font-weight:600; text-align:right; white-space:nowrap;}
  .glass{background:#fff !important; box-shadow:none !important; backdrop-filter:none !important; border:1px solid #ddd !important;}
  .table-wrap{max-height:none; overflow:visible;}
  thead th{position:static; background:#fff !important; backdrop-filter:none !important;}
  table{width:100%; font-size:.7rem;}
  th.c-sticky, td.c-sticky{position:static; background:#fff !important;}
  .cell-text, .cell-clamp{display:block; width:auto; min-width:0; max-width:none; -webkit-line-clamp:unset; overflow:visible;}
}

@media (max-width:960px){
  .dash-grid{grid-template-columns:1fr;}
  .chart-grid{grid-template-columns:1fr;}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;}
  #sidebar{
    position:fixed; left:0; top:0; height:100vh; width:270px; margin:0; z-index:60; border-radius:0;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  #sidebar.open{transform:translateX(0);}
  #main{padding:10px;}
  #menuToggle{display:inline-flex;}
  #recordForm{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .modal-overlay{padding:10px;}
  .modal-detail{max-height:92vh;}
  td.c-sticky .cell-text{max-width:130px;}
  th.col-actions, td.col-actions{position:static; border-left:0;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:55;}
  .sidebar-backdrop.show{display:block;}
}

.setup-banner.info{border-left-color:var(--cyan); margin-bottom:14px;}
.setup-banner.info svg{color:var(--cyan);}
</style>

function esc(v){
  return String(v===undefined||v===null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function truncate(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n)+"…" : s; }
function isoDate(d){ /* tanggal LOKAL (toISOString memakai UTC dan bisa mundur sehari) */
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(v){
  if(v===undefined || v===null || v==="") return "—";
  const s = String(v).trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(!m) return esc(s);
  return parseInt(m[3],10)+" "+MONTHS_ID[parseInt(m[2],10)-1]+" "+m[1];
}
function timeAgo(d){
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<10) return "baru saja";
  if(s<60) return s+" detik lalu";
  const m = Math.floor(s/60);
  if(m<60) return m+" menit lalu";
  const h = Math.floor(m/60);
  return h+" jam lalu";
}
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function csvEscape(v){ v = v===undefined||v===null?"":String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }

/* ---- Kode klausul ISO: Google Sheets sering mengubah "4.1" / "8.5.1" menjadi TANGGAL ---- */
function isClauseField(f){ return f.name==="Kode_Klausul" || f.ref==="Master_Klausul_ISO9001"; }
function clauseFromIso(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if(!m) return v;
  const y=+m[1], mo=+m[2], d=+m[3];
  /* "d.m" tanpa tahun -> tahun berjalan (>=2020); "d.m.yy" -> tahun 2000+yy */
  return (y>=2001 && y<=2019) ? d+"."+mo+"."+(y-2000) : d+"."+mo;
}
function normKey(s){ return String(s===undefined||s===null?"":s).trim().toLowerCase(); }
function isBlank(v){ return v===undefined||v===null||String(v).trim()===""||String(v).trim()==="-"; }
function safeUrl(u){ u=String(u===undefined||u===null?"":u).trim(); return /^https?:\/\//i.test(u) ? u : ""; }

/* Hitung kolom turunan (keterlambatan & level risiko) di sisi browser supaya tidak bergantung pada versi Code.gs */
function applyCalc(table, rows){
  const today = isoDate(new Date());
  if(table.overdueField){
    const cfg = table.overdueField;
    rows.forEach(r=>{
      const d = r[cfg.dateField];
      const closed = (cfg.statusField && (cfg.closedValues||[]).includes(r[cfg.statusField])) || (cfg.doneField && !isBlank(r[cfg.doneField]));
      r._overdue = !!(d && String(d) < today && !closed);
    });
  }
  if(table.riskCalc){
    rows.forEach(r=>{
      const l = Number(r[table.riskCalc.likelihood])||0, i = Number(r[table.riskCalc.impact])||0, s = l*i;
      r.Level_Risiko = s;
      r.Level_Risiko_Label = s===0 ? "-" : s<=5 ? "Rendah" : s<=14 ? "Sedang" : "Tinggi";
    });
  }
  return rows;
}
function normalizeRows(tableName, rows){
  const table = SCHEMA.tables[tableName];
  const out = (rows||[]).map(r=>{
    if(!Object.keys(r).some(k=>k!==k.trim())) return r;
    const o = {}; Object.keys(r).forEach(k=>{ o[k.trim()] = r[k]; }); return o;   /* header sheet berspasi: " Merek & Tipe/Model" */
  });
  if(!table) return out;
  const clauseCols = table.fields.filter(isClauseField).map(f=>f.name);
  if(clauseCols.length){
    out.forEach(r=>{ clauseCols.forEach(n=>{ if(/^\d{4}-\d{2}-\d{2}/.test(String(r[n]===undefined?"":r[n]))) r[n] = clauseFromIso(r[n]); }); });
  }
  return applyCalc(table, out);
}

function resolveRef(tableName,key){
  if(key===undefined||key===null||key==="") return "";
  const t = SCHEMA.tables[tableName]; if(!t) return key;
  const rows = STATE.allData[tableName]||[];
  let row = rows.find(r=>String(r[t.key])===String(key));
  /* Sebagian data lama di sheet berisi NAMA (mis. "HRD"), bukan ID -> cocokkan juga lewat kolom tampilan */
  if(!row) row = rows.find(r=>normKey(r[t.display])===normKey(key));
  return row ? (row[t.display]||key) : key;
}
function resolveRefMulti(tableName,val){
  if(!val) return [];
  return String(val).split(",").map(s=>s.trim()).filter(Boolean).map(k=>resolveRef(tableName,k));
}

function fetchWithTimeout(url, options){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  return fetch(url, Object.assign({}, options, {signal:ctrl.signal}))
    .catch(err=>{
      if(err.name==="AbortError") throw new Error("Waktu koneksi ke server habis. Periksa koneksi atau Apps Script.");
      throw new Error("Gagal menghubungi server.");
    })
    .finally(()=>clearTimeout(timer));
}
const api = {
  async get(action, params){
    if(!CONFIG.API_URL) throw new Error("URL Web App belum diisi.");
    const url = new URL(CONFIG.API_URL);
    url.searchParams.set("action", action);
    if(params) Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const res = await fetchWithTimeout(url.toString());
    let json;
    try{ json = await res.json(); }catch(e){ throw new Error("Respons bukan JSON. Pastikan Web App di-deploy dengan akses \"Anyone\"."); }
    if(!json.ok) throw new Error(json.error||"Terjadi kesalahan pada server");
    return json;
  },
  async post(payload){
    if(!CONFIG.API_URL) throw new Error("URL Web App belum diisi.");
    if(STATE.token) payload = Object.assign({}, payload, {token:STATE.token});
    const res = await fetchWithTimeout(CONFIG.API_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    let json;
    try{ json = await res.json(); }catch(e){ throw new Error("Respons bukan JSON. Pastikan Web App di-deploy dengan akses \"Anyone\"."); }
    if(!json.ok){
      if(/Sesi berakhir/i.test(json.error||"")) handleSessionExpired();
      throw new Error(json.error||"Terjadi kesalahan pada server");
    }
    return json;
  }
};

let loadInFlight = null;
async function loadAll(silent){
  if(!CONFIG.API_URL) return;
  if(loadInFlight) return loadInFlight;
  const epoch = STATE.epoch;
  loadInFlight = (async function(){
    try{
      const res = await api.get("getAll");
      const data = {};
      Object.keys(res.data||{}).forEach(t=>{ data[t] = normalizeRows(t, res.data[t]); });
      /* Tabel yang ada di HTML tetapi tidak dikirim backend (mis. Code.gs versi lama) -> ambil satu per satu */
      const missing = Object.keys(SCHEMA.tables).filter(t=>!(t in data) && !SCHEMA.tables[t].secret);
      if(missing.length){
        const got = await Promise.allSettled(missing.map(t=>api.get("getData",{table:t})));
        got.forEach((g,i)=>{
          const t = missing[i];
          data[t] = g.status==="fulfilled" ? normalizeRows(t, g.value.data) : (STATE.allData[t]||[]);
        });
      }
      /* Ada simpan/hapus selagi permintaan berjalan -> hasil ini basi, buang (polling berikutnya akan menyegarkan) */
      if(epoch!==STATE.epoch) return;
      STATE.allData = data;
      STATE.lastSync = new Date();
      updateSyncIndicator(true);
    }catch(err){
      updateSyncIndicator(false);
      if(!silent) toast("Gagal memuat data: "+err.message,"error");
    }finally{
      loadInFlight = null;
    }
  })();
  return loadInFlight;
}

}

function computeDashboardClient(){
  const T = STATE.allData;
  const temuan = T.Audit_Temuan||[], capa = T.CAPA_Register||[], risk = T.Risk_Register||[],
        jadwal = T.Audit_Jadwal||[], kalibrasi = T.Kalibrasi_Alat_Ukur||[], sertifikat = T.Sertifikasi_ISO||[],
        komplain = T.Komplain_Pelanggan||[];
  const todayStr = isoDate(new Date());
  const in30 = new Date(); in30.setDate(in30.getDate()+30);
  const in30Str = isoDate(in30);
  const calCfg = SCHEMA.tables.Kalibrasi_Alat_Ukur.overdueField;
  const kalibrasiBelumSelesai = r => !((calCfg.closedValues||[]).includes(r[calCfg.statusField]) || !isBlank(r[calCfg.doneField]));
  return {
    temuan_open: temuan.filter(r=>["Open","In Progress"].includes(r.Status)).length,
    temuan_overdue: temuan.filter(r=>r._overdue).length,
    temuan_major: temuan.filter(r=>r.Klasifikasi==="Major NC" && !["Closed","Verified"].includes(r.Status)).length,
    temuan_total: temuan.length,
    capa_open: capa.filter(r=>r.Status!=="Closed").length,
    capa_overdue: capa.filter(r=>r._overdue).length,
    capa_total: capa.length,
    risk_tinggi: risk.filter(r=>r.Level_Risiko_Label==="Tinggi" && r.Status!=="Closed").length,
    audit_bulan_ini: jadwal.filter(r=> r.Tgl_Rencana && String(r.Tgl_Rencana).slice(0,7)===todayStr.slice(0,7)).length,
    kalibrasi_belum_selesai: kalibrasi.filter(kalibrasiBelumSelesai).length,
    sertifikat_akan_expired: sertifikat.filter(r=> r.Tgl_Kadaluarsa && String(r.Tgl_Kadaluarsa)<=in30Str).length,
    komplain_open: komplain.filter(r=>r.Status!=="Closed").length
  };
}
function computeCompletionScore(){
  const temuan = STATE.allData.Audit_Temuan||[], capa = STATE.allData.CAPA_Register||[];
  const total = temuan.length + capa.length;
  if(total===0) return null;
  const done = temuan.filter(r=>["Closed","Verified"].includes(r.Status)).length + capa.filter(r=>r.Status==="Closed").length;
  return Math.round(done/total*100);
}
function gaugeSvg(score){
  const r=70, c=2*Math.PI*r;
  if(score===null){
    return '<svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/></svg>'+
      '<div class="gauge-center"><div class="gauge-score" style="color:var(--text-3)">—</div><div class="gauge-score-sub">Belum ada data</div></div>';
  }
  const color = score>=80?"var(--emerald)":score>=50?"var(--amber)":"var(--rose)";
  const offset = c*(1-score/100);
  return '<svg viewBox="0 0 180 180">'+
    '<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>'+
    '<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="14" stroke-linecap="round" '+
    'stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset .6s ease"/>'+
    "</svg>"+
    '<div class="gauge-center"><div class="gauge-score" style="color:'+color+'">'+score+"%</div><div class=\"gauge-score-sub\">SELESAI</div></div>";
}

function barChart(rows, field, options, colorFn){
  const counts = options.map(o=>rows.filter(r=>r[field]===o).length);
  const max = Math.max(1,...counts);
  if(rows.length===0) return '<div class="chart-empty">Belum ada data.</div>';
  return options.map((o,i)=>{
    const c = colorFn(o);
    return '<div class="bar-row"><div class="bar-label">'+esc(o)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(counts[i]/max*100)+'%;background:var(--'+c+')"></div></div><div class="bar-value">'+counts[i]+"</div></div>";
  }).join("");
}

        ${kpiCard("message-square-warning","Komplain Open",d.komplain_open,"indigo","Komplain_Pelanggan")}
      </div>

      <div class="glass chart-card"><h3>Temuan Berdasarkan Klasifikasi</h3>${barChart(temuan,"Klasifikasi",["Major NC","Minor NC","Observation","OFI","Positive Practice"],badgeClass)}</div>
      <div class="glass chart-card"><h3>Status CAPA</h3>${barChart(capaRows,"Status",["Open","Analisa","Tindakan","Verifikasi","Closed"],badgeClass)}</div>
    </div>
  `;
  renderIcons();
  setSidebarActive();
}
function kpiCard(icon,label,value,color,table){
  return '<div class="kpi-card kpi-'+color+'" data-action="nav-table" data-table="'+table+'">'+
    '<div class="kpi-icon"><i data-lucide="'+icon+'"></i></div>'+
    '<div class="kpi-value">'+value+'</div><div class="kpi-label">'+esc(label)+"</div></div>";
}

// ==========================================================================
// TABLE VIEW
// ==========================================================================
function canCreate(t){ return !t.readonly && !t.noCreate && !STATE.viewOnly; }
function canEdit(t){ return !t.readonly && !STATE.viewOnly; }
function canDelete(t){ return !t.readonly && !t.noDelete && !STATE.viewOnly; }
function showActions(t){ return canEdit(t) || canDelete(t); }

/* Kolom yang tampil di tabel. Kolom lainnya tetap bisa dilihat lewat klik baris (detail) atau tombol "Semua kolom".
   Tabel yang tidak tercantum di sini menampilkan seluruh kolomnya. Ubah daftar ini bila kolom penting berubah. */
const LIST_COLS = {
  Master_Alat:["Kode Alat","Nama Alat","Kategori","Merk","Model/Tipe","Lokasi","Departemen","Status","Tanggal PM Berikutnya"],
  Master_Mesin:["Kode Mesin","Nama Mesin","Kategori","Merk","Lokasi","Departemen","Status","Tanggal PM Berikutnya"],
  Kalibrasi_Alat_Ukur:["ID Kalibrasi","Tanggal","Nama Alat/Mesin","Departemen","Lembaga Kalibrasi","Tingkat Urgensi","Status Kalibrasi","Target Tanggal Selesai"],
  Audit_Temuan:["ID_Temuan","Klausul_Terkait","Deskripsi_Temuan","Klasifikasi","Departemen_Terkait","PIC_Tindak_Lanjut","Batas_Waktu","Status"]
};

function buildColumns(table, tableName){
  let fields = table.fields.filter(f=>!f.hidden);
  const subset = LIST_COLS[tableName];
  if(subset && !STATE.fullCols[tableName]){
    const picked = subset.map(n=>fields.find(f=>f.name===n)).filter(Boolean);
    if(picked.length) fields = picked;
  }
  const cols = fields.map(f=>({name:f.name,label:f.label,type:f.type,ref:f.ref}));
  if(table.riskCalc) cols.push({name:"Level_Risiko_Label",label:"Level Risiko",type:"computed_risk"});
  if(table.overdueField) cols.push({name:"_overdue",label:"Keterangan Waktu",type:"computed_overdue"});
  return cols;
}

/* class kolom: kolom pertama menempel; angka rata kanan; tanggal/badge tidak dipatahkan */
function colClass(col, idx){
  let c = idx===0 ? "c-sticky" : "";
  if(col.type==="number" || col.type==="currency") c += " c-num";
  else if(["date","enum","badge","yesno","file","computed_risk","computed_overdue"].includes(col.type)) c += " c-nowrap";
  return c.trim();
}

function renderCell(col, row, tableName){
  const v = row[col.name];
  switch(col.type){
    case "appsheet_image": {
      if(isBlank(v)) return "—";
      let imgUrl = String(v);
      // Membaca path gambar dan membuat URL ke AppSheet dengan App ID yang diminta
      if(!/^https?:\/\//i.test(imgUrl)){
        const encodedFile = encodeURIComponent(imgUrl);
        const appSheetTable = tableName === "Master_Karyawan" ? "Karyawan" : tableName;
        imgUrl = `https://www.appsheet.com/template/gettablefileurl?appName=MSBHumanResource-310640119&tableName=${appSheetTable}&fileName=${encodedFile}`;
      }
      return `<span class="employee-photo-wrap"><img class="employee-photo" src="${esc(imgUrl)}" alt="Foto" title="Klik untuk memperbesar" tabindex="0" data-action="view-photo" data-img="${esc(imgUrl)}"/></span>`;
    }
    case "ref": return isBlank(v) ? "—" : '<div class="cell-text">'+esc(resolveRef(col.ref,v))+"</div>";
    case "refmulti": { const arr=resolveRefMulti(col.ref,v); return arr.length? '<div class="cell-chips">'+arr.map(x=>'<span class="chip">'+esc(x)+"</span>").join("")+"</div>":"—"; }
    case "enum": case "badge": return isBlank(v) ? "—" : '<span class="badge badge-'+badgeClass(v)+'">'+esc(v)+"</span>";
    case "enumlist": { const arr=String(v===undefined||v===null?"":v).split(",").map(s=>s.trim()).filter(Boolean); return arr.length? '<div class="cell-chips">'+arr.map(x=>'<span class="chip">'+esc(x)+"</span>").join("")+"</div>":"—"; }
    case "yesno": return v==="Ya" ? '<span class="badge badge-emerald">Ya</span>' : v==="Tidak" ? '<span class="badge badge-slate">Tidak</span>' : "—";
    case "date": return fmtDate(v);
    case "file": {
      if(isBlank(v)) return "—";
      const u = safeUrl(v);
      /* Kolom file di sheet bisa berisi URL atau hanya nama file (mis. MAN-QMS-001_Manual_SMM.pdf) */
      return u ? '<a class="file-link" href="'+esc(u)+'" target="_blank" rel="noopener"><i data-lucide="paperclip"></i>Lihat</a>'
               : '<span title="'+esc(v)+'">'+esc(truncate(v,34))+"</span>";
    }
    case "number": return (v===undefined||v===null||v==="") ? "—" : esc(v);
    case "currency": {
      if(v===undefined||v===null||v==="") return "—";
      const n = Number(v);
      return isFinite(n) ? "Rp "+n.toLocaleString("id-ID") : esc(v);
    }
    case "textarea": return isBlank(v) ? "—" : '<div class="cell-clamp" title="'+esc(truncate(v,400))+'">'+esc(v)+"</div>";
    case "computed_risk": { const l=row.Level_Risiko_Label; return l && l!=="-" ? '<span class="badge badge-'+badgeClass(l)+'">'+esc(l)+" ("+row.Level_Risiko+")</span>" : "—"; }
    case "computed_overdue": {
      if(row._overdue) return '<span class="badge badge-rose">Terlambat</span>';
      return '<span class="badge badge-emerald">Sesuai Jadwal</span>';
    }
    default: {   /* angka 0 tetap tampil */
      if(v===undefined||v===null||String(v)==="") return "—";
      const t = String(v);
      return '<div class="cell-text"'+(t.length>40?' title="'+esc(truncate(t,400))+'"':"")+">"+esc(t)+"</div>";
    }
  }
}

function renderTableView(tableName){
  STATE.view = "table"; STATE.currentTable = tableName;
  const table = SCHEMA.tables[tableName];
  const columns = buildColumns(table, tableName);
  const group = SCHEMA.groups.find(g=>g.key===table.group);
  const note = table.sourceNote ? '<div class="glass setup-banner info"><i data-lucide="info"></i><p>'+esc(table.sourceNote)+'</p></div>' : "";
  const colToggle = LIST_COLS[tableName]
    ? `<button class="btn btn-ghost" data-action="toggle-cols" data-table="${tableName}"><i data-lucide="table"></i>${STATE.fullCols[tableName] ? "Kolom penting" : "Semua kolom"}</button>` : "";

  $content.innerHTML = `
    <div class="view-header">
      <div><div class="breadcrumb">${esc(group.label)}</div><h1>${esc(table.label)}</h1></div>
      <div class="view-actions">
        <div class="search-box"><i data-lucide="search"></i><input id="tableSearchInput" placeholder="Cari di ${esc(table.label)}..." value="${esc(STATE.tableSearch)}"/></div>
        ${colToggle}
        <button class="btn btn-ghost" data-action="export-csv" data-table="${tableName}"><i data-lucide="download"></i>Export CSV</button>
        <button class="btn btn-ghost" data-action="print-view"><i data-lucide="printer"></i>Cetak</button>
        ${canCreate(table) ? `<button class="btn btn-primary" data-action="add-record" data-table="${tableName}"><i data-lucide="plus"></i>Tambah Data</button>` : ""}
      </div>
    </div>
    ${note}
    <div class="glass table-wrap">
      <table>
        <thead><tr>${columns.map((c,i)=>'<th class="'+colClass(c,i)+'">'+esc(c.label)+"</th>").join("")}<th class="col-actions">${showActions(table)?"Aksi":"Detail"}</th></tr></thead>
        <tbody id="tbody-${tableName}"></tbody>
      </table>
    </div>
    <div class="table-footer" id="tableFooter-${tableName}"></div>
  `;
  refreshTableRows(tableName, columns);
  const input = document.getElementById("tableSearchInput");
  input.addEventListener("input", debounce(e=>{ STATE.tableSearch = e.target.value; refreshTableRows(tableName, columns); }, 220));
  renderIcons();
  setSidebarActive();
}

function refreshTableRows(tableName, columns){
  const table = SCHEMA.tables[tableName];
  const rows = (STATE.allData[tableName]||[]).slice();
  const idxOf = new Map(rows.map((r,i)=>[r,i]));   /* posisi asli baris (ID tertentu, mis. Kalibrasi, bisa muncul berulang) */
  const q = STATE.tableSearch.trim().toLowerCase();
  const refCols = table.fields.filter(f=>f.type==="ref"||f.type==="refmulti");
  const rowText = r=>{
    let s = Object.values(r).join(" ");
    refCols.forEach(f=>{ s += " " + (f.type==="ref" ? resolveRef(f.ref,r[f.name]) : resolveRefMulti(f.ref,r[f.name]).join(" ")); });
    return s.toLowerCase();
  };
  const filtered = q ? rows.filter(r=>rowText(r).includes(q)) : rows;
  /* tabel transaksi (audit, CAPA, dst): data terbaru di atas; tabel master & sumber IMPORTRANGE: ikuti urutan sheet */
  const newestFirst = table.group!=="master" && !table.readonly && !table.noCreate;
  const display = newestFirst ? filtered.slice().reverse() : filtered;
  const tbody = document.getElementById("tbody-"+tableName);
  const footer = document.getElementById("tableFooter-"+tableName);
  if(!tbody) return;

  if(display.length===0){
    tbody.innerHTML = '<tr><td colspan="'+(columns.length+1)+'" class="empty-state">'+
      (rows.length===0 ? (table.readonly ? "Belum ada data di sheet sumber." : "Belum ada data. Pastikan Sheet diisi atau klik Tambah Data.") : "Tidak ada data yang cocok dengan pencarian.")+"</td></tr>";
  } else {
    tbody.innerHTML = display.map(r=>{
      const keyVal = r[table.key];
      const ref = 'data-table="'+tableName+'" data-key="'+esc(keyVal)+'" data-idx="'+idxOf.get(r)+'"';
      return '<tr class="'+(r._overdue?"row-overdue":"")+'" data-action="view-detail" '+ref+'>'+
        columns.map((c,i)=>{
          const h = renderCell(c, r, tableName);
          return '<td class="'+colClass(c,i)+'">'+(h==="—" ? '<span class="cell-muted">—</span>' : h)+"</td>";
        }).join("")+
        '<td class="col-actions">'+
        '<button class="icon-btn" data-action="view-detail" '+ref+' title="Lihat detail"><i data-lucide="eye"></i></button> '+
        (canEdit(table) ? '<button class="icon-btn" data-action="edit-record" data-table="'+tableName+'" data-key="'+esc(keyVal)+'" title="Edit"><i data-lucide="pencil"></i></button> ' : "")+
        (canDelete(table) ? '<button class="icon-btn icon-btn-danger" data-action="delete-record" data-table="'+tableName+'" data-key="'+esc(keyVal)+'" title="Hapus"><i data-lucide="trash-2"></i></button>' : "")+
        "</td></tr>";
    }).join("");
  }
  if(footer){
    const subsetOn = !!LIST_COLS[tableName] && !STATE.fullCols[tableName];
    footer.innerHTML = "<span>"+display.length+" dari "+rows.length+" data</span>"+
      "<span>Klik baris untuk melihat detail. Geser ke samping untuk kolom lainnya.</span>"+
      (subsetOn ? '<span>Hanya kolom penting yang ditampilkan. Pilih "Semua kolom" untuk selengkapnya.</span>' : "");
  }
  renderIcons();
}

// ==========================================================================
// MODAL — DETAIL RECORD (klik baris)
// ==========================================================================
function findRecord(tableName, key, idx){
  const table = SCHEMA.tables[tableName];
  const rows = STATE.allData[tableName]||[];
  const i = Number(idx);
  if(Number.isInteger(i) && rows[i] && String(rows[i][table.key])===String(key)) return rows[i];
  return rows.find(r=>String(r[table.key])===String(key)) || null;
}

function detailValueHtml(f, row, tableName){
  const v = row[f.name];
  const empty = '<span class="dv-empty">—</span>';
  switch(f.type){
    case "textarea": return isBlank(v) ? empty : '<div class="is-long">'+esc(v)+"</div>";
    case "ref": return isBlank(v) ? empty : esc(resolveRef(f.ref,v));
    case "file": {
      if(isBlank(v)) return empty;
      const u = safeUrl(v);
      return u ? '<a class="file-link" href="'+esc(u)+'" target="_blank" rel="noopener"><i data-lucide="paperclip"></i>Buka file</a>' : esc(v);
    }
    case "appsheet_image": {
      if(isBlank(v)) return empty;
      /* foto dibesarkan di sini; tanpa lightbox agar modal detail tidak tertutup */
      return '<div class="detail-photo">'+renderCell({name:f.name,type:f.type}, row, tableName).replace(' data-action="view-photo"',"").replace(' title="Klik untuk memperbesar"',"")+"</div>";
    }
    case "text": case "email": {
      if(isBlank(v)) return empty;
      const u = safeUrl(v);
      return u ? '<a class="file-link" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(v)+"</a>" : esc(v);
    }
    default: {
      const h = renderCell({name:f.name,label:f.label,type:f.type,ref:f.ref}, row, tableName);
      return h==="—" ? empty : h;
    }
  }
}

function openDetailModal(tableName, key, idx){
  const table = SCHEMA.tables[tableName];
  if(!table || table.secret) return;
  const row = findRecord(tableName, key, idx);
  if(!row){ toast("Data tidak ditemukan. Coba muat ulang halaman.","error"); return; }
  const fields = table.fields.filter(f=>!f.hidden);

  const dispField = fields.find(f=>f.name===table.display);
  const rawTitle = (dispField && dispField.type==="ref") ? resolveRef(dispField.ref, row[dispField.name]) : row[table.display];
  const title = isBlank(rawTitle) ? (isBlank(row[table.key]) ? table.label : String(row[table.key])) : String(rawTitle);

  const keyField = fields.find(f=>f.name===table.key);
  const statusField = fields.find(f=>/^Status/.test(f.name) && (f.type==="enum"||f.type==="badge"));
  let badges = "";
  if(keyField && !isBlank(row[table.key]) && String(row[table.key])!==title) badges += '<span class="detail-id">'+esc(keyField.label)+": "+esc(row[table.key])+"</span>";
  if(statusField && !isBlank(row[statusField.name])) badges += renderCell(statusField, row, tableName);
  if(table.riskCalc) { const h = renderCell({type:"computed_risk"}, row, tableName); if(h!=="—") badges += h; }
  if(table.overdueField) badges += renderCell({type:"computed_overdue"}, row, tableName);

  const FULL = ["textarea","refmulti","enumlist","file","appsheet_image"];
  const items = fields.map(f=>
    '<div class="dv-item'+(FULL.includes(f.type)?" full":"")+'"><div class="dv-label">'+esc(f.label)+'</div><div class="dv-value">'+detailValueHtml(f,row,tableName)+"</div></div>"
  ).join("");

  const keyAttr = 'data-table="'+tableName+'" data-key="'+esc(row[table.key])+'"';
  $modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal modal-detail glass" role="dialog" aria-modal="true" aria-label="Detail ${esc(table.label)}">
        <div class="modal-header detail-head">
          <div class="detail-head-main">
            <div class="breadcrumb">${esc(table.label)}</div>
            <h2 class="detail-title">${esc(title)}</h2>
            ${badges ? '<div class="detail-badges">'+badges+"</div>" : ""}
          </div>
          <button class="icon-btn" data-action="close-modal" aria-label="Tutup"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body"><div class="detail-grid">${items}</div></div>
        <div class="modal-footer">
          ${canDelete(table) ? `<button class="btn btn-danger btn-push-left" data-action="delete-record" ${keyAttr}><i data-lucide="trash-2"></i>Hapus</button>` : ""}
          <button class="btn btn-ghost" data-action="close-modal">Tutup</button>
          ${canEdit(table) ? `<button class="btn btn-primary" data-action="edit-record" ${keyAttr}><i data-lucide="pencil"></i>Edit</button>` : ""}
        </div>
      </div>
    </div>`;
  renderIcons();
}

function fieldInputHtml(table, field, record, isEdit){
  const raw = record ? record[field.name] : "";
  const val = (raw===undefined||raw===null) ? "" : raw;
  const isKey = field.name === table.key;
  const req = field.required && !field.locked ? '<span class="req">*</span>' : "";
  const lockedKey = isKey && (field.auto || isEdit);
  const dis = (lockedKey || field.locked) ? "disabled" : "";
  let input = "";

  switch(field.type){
    case "text": case "email":
      input = '<input type="'+(field.type==="email"?"email":"text")+'" name="'+field.name+'" value="'+esc(val)+'" '+dis+' '+(!dis && (isKey&&!field.auto&&!isEdit || field.required)?"required":"")+' placeholder="'+(field.note?esc(field.note):(isKey&&field.auto?"(dibuat otomatis)":""))+'"/>';
      break;
    case "number": case "currency":
      input = '<input type="number" step="any" name="'+field.name+'" value="'+esc(val)+'" '+(field.min!==undefined?'min="'+field.min+'"':"")+' '+(field.max!==undefined?'max="'+field.max+'"':"")+' '+(field.required?"required":"")+'/>';
      break;
    case "date":
      input = '<input type="date" name="'+field.name+'" value="'+esc(String(val).slice(0,10))+'" '+(field.required?"required":"")+'/>';
      break;
    case "textarea":
      input = '<textarea name="'+field.name+'" '+(field.required?"required":"")+'>'+esc(val)+"</textarea>";
      break;
    case "enum": case "badge": {
      const options = field.options || [];
      /* nilai di sheet yang belum ada di daftar pilihan tetap ditampilkan agar tidak hilang saat edit */
      const extra = (val!=="" && !options.includes(val)) ? '<option value="'+esc(val)+'" selected>'+esc(val)+' (nilai di sheet)</option>' : "";
      const opts = options.map(o=>'<option value="'+esc(o)+'" '+(o===val?"selected":"")+'>'+esc(o)+"</option>").join("");
      input = '<select name="'+field.name+'" '+(field.required?"required":"")+'><option value="">— pilih —</option>'+opts+extra+"</select>";
      break;
    }
    case "yesno":
      input = '<select name="'+field.name+'"><option value="">— pilih —</option><option value="Ya" '+(val==="Ya"?"selected":"")+'>Ya</option><option value="Tidak" '+(val==="Tidak"?"selected":"")+'>Tidak</option></select>';
      break;
    case "enumlist": {
      const selected = String(val).split(",").map(s=>s.trim());
      const boxes = field.options.map(o=>'<label class="chk"><input type="checkbox" name="'+field.name+'[]" value="'+esc(o)+'" '+(selected.includes(o)?"checked":"")+'/> '+esc(o)+"</label>").join("");
      input = '<div class="checklist">'+boxes+"</div>";
      break;
    }
    case "ref": {
      const refT = SCHEMA.tables[field.ref];
      const list = STATE.allData[field.ref]||[];
      let hit = false;
      let opts = list.map(o=>{
        const isSel = String(o[refT.key])===String(val) || (val!=="" && !list.some(x=>String(x[refT.key])===String(val)) && normKey(o[refT.display])===normKey(val));
        if(isSel) hit = true;
        return '<option value="'+esc(o[refT.key])+'" '+(isSel?"selected":"")+'>'+esc(o[refT.display]||o[refT.key])+"</option>";
      }).join("");
      if(val!=="" && !hit) opts += '<option value="'+esc(val)+'" selected>'+esc(val)+' (nilai di sheet)</option>';
      input = '<select name="'+field.name+'" '+(field.required?"required":"")+'><option value="">— pilih '+esc(refT.label)+' —</option>'+opts+"</select>";
      break;
    }
    case "refmulti": {
      const refT = SCHEMA.tables[field.ref];
      const list = STATE.allData[field.ref]||[];
      const selected = String(val).split(",").map(s=>normKey(s)).filter(Boolean);
      const boxes = list.map(o=>{
        const kv = o[refT.key];
        const isSel = selected.includes(normKey(kv)) || selected.includes(normKey(o[refT.display]));
        return '<label class="chk"><input type="checkbox" name="'+field.name+'[]" value="'+esc(kv)+'" '+(isSel?"checked":"")+'/> '+esc(o[refT.display]||kv)+"</label>";
      }).join("");
      input = '<div class="checklist">'+(boxes||'<span class="hint">Belum ada data '+esc(refT.label)+'</span>')+"</div>";
      break;
    }
    case "appsheet_image":
    case "file": {
      const u = safeUrl(val);
      input = '<div class="file-field">'+
        (u ? '<a class="file-link-existing" href="'+esc(u)+'" target="_blank" rel="noopener">File/Foto saat ini &rarr;</a>'
           : (!isBlank(val) ? '<span class="hint">File saat ini: '+esc(val)+'</span>' : ""))+
        '<input type="file" data-file-field="'+field.name+'"/>'+
        '<input type="hidden" name="'+field.name+'" value="'+esc(val)+'"/>'+
        "</div>";
      break;
    }
    default:
      input = '<input type="text" name="'+field.name+'" value="'+esc(val)+'" '+dis+'/>';
  }
  const full = (field.type==="textarea"||field.type==="enumlist"||field.type==="refmulti"||field.type==="file"||field.type==="appsheet_image") ? " full" : "";
  return '<div class="form-group'+full+'"><label>'+esc(field.label)+req+"</label>"+input+"</div>";
}

function openRecordModal(tableName, keyValue){
  const table = SCHEMA.tables[tableName];
  if(STATE.viewOnly || table.readonly) return;
  const isEdit = !!keyValue;
  if(!isEdit && !canCreate(table)) return;
  const record = isEdit ? (STATE.allData[tableName]||[]).find(r=>String(r[table.key])===String(keyValue)) : {};
  const fieldsHtml = table.fields.filter(f=>!f.hidden).map(f=>fieldInputHtml(table,f,record,isEdit)).join("");
  $modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal glass">
        <div class="modal-header"><h2>${isEdit?"Edit":"Tambah"} — ${esc(table.label)}</h2>
          <button class="icon-btn" data-action="close-modal"><i data-lucide="x"></i></button></div>
        <div class="modal-body"><form id="recordForm">${fieldsHtml}</form></div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-action="close-modal">Batal</button>
          <button class="btn btn-primary" id="saveRecordBtn" data-action="save-record" data-table="${tableName}" data-key="${esc(keyValue||"")}">
            <i data-lucide="save"></i>${isEdit?"Simpan Perubahan":"Simpan"}
          </button>
        </div>
      </div>
    </div>`;
  renderIcons();
}

function openPhotoLightbox(url){

  $modalRoot.innerHTML = `
    <div class="modal-overlay photo-lightbox-overlay">
      <div class="photo-lightbox-card">
        <button class="icon-btn photo-lightbox-close" data-action="close-modal" aria-label="Tutup"><i data-lucide="x"></i></button>
        <img src="${esc(url)}" alt="Foto Karyawan"/>
      </div>
    </div>`;
  renderIcons();
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFileToServer(file){
  const base64 = await fileToBase64(file);
  const res = await api.post({action:"uploadFile", base64, fileName:file.name, mimeType:file.type||"application/octet-stream"});
  return res.data.url;
}

async function saveRecord(tableName, keyValue){
  const table = SCHEMA.tables[tableName];
  if(STATE.viewOnly || table.readonly) return;
  const form = document.getElementById("recordForm");
  const btn = document.getElementById("saveRecordBtn");
  const originalHtml = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = "Menyimpan...";
  try{
    const data = {};
    table.fields.forEach(f=>{
      if(f.locked) return;                       // kolom sumber IMPORTRANGE tidak ikut dikirim
      if(f.type==="enumlist" || f.type==="refmulti"){
        const boxes = form.querySelectorAll('input[name="'+f.name+'[]"]:checked');
        data[f.name] = Array.from(boxes).map(b=>b.value).join(", ");
      } else if(f.type==="file" || f.type==="appsheet_image"){
        // handled below
      } else {
        const el = form.elements[f.name];
        if(el) data[f.name] = typeof el.value==="string" ? el.value.trim() : el.value;
      }
    });
    const fileInputs = form.querySelectorAll('input[type=file][data-file-field]');
    for(const fi of fileInputs){
      const fname = fi.dataset.fileField;
      if(fi.files && fi.files[0]){
        toast("Mengunggah file "+fi.files[0].name+"...", "info");
        data[fname] = await uploadFileToServer(fi.files[0]);
      } else {
        const hidden = form.querySelector('input[type=hidden][name="'+fname+'"]');
        data[fname] = hidden ? hidden.value : "";
      }
    }
    const missing = table.fields.filter(f=>f.required && !f.locked && (data[f.name]===undefined||data[f.name]===""));
    if(missing.length){
      toast("Field wajib belum diisi: "+missing.map(f=>f.label).join(", "),"error");
      btn.disabled=false; btn.innerHTML=originalHtml; renderIcons();
      return;
    }
    if(!keyValue && data[table.key] && (STATE.allData[tableName]||[]).some(r=>String(r[table.key])===String(data[table.key]))){
      toast("Gagal: "+table.key.replace(/_/g," ")+" '"+data[table.key]+"' sudah ada.","error");
      btn.disabled=false; btn.innerHTML=originalHtml; renderIcons();
      return;
    }
    STATE.epoch++;                                // tandai: hasil polling yang sedang berjalan jadi basi
    if(keyValue){
      await api.post({action:"update", table:tableName, key:keyValue, data});
      toast("Data berhasil diperbarui","success");
    } else {
      await api.post({action:"create", table:tableName, data});
      toast("Data berhasil ditambahkan","success");
    }
    closeModal();
    try{ await loadTable(tableName); }
    catch(e){ toast("Tersimpan, tetapi gagal menyegarkan data: "+e.message,"error"); }
    if(STATE.view==="table" && STATE.currentTable===tableName) renderTableView(tableName);
    else if(STATE.view==="dashboard") renderDashboard();
  }catch(err){
    toast("Gagal menyimpan: "+err.message,"error");
    btn.disabled = false; btn.innerHTML = originalHtml; renderIcons();
  }
}

async function confirmDelete(tableName, keyValue){
  const table = SCHEMA.tables[tableName];
  if(STATE.viewOnly || !canDelete(table)) return;
  if(!confirm('Hapus data ini dari "'+table.label+'"? Tindakan tidak bisa dibatalkan.')) return;
  try{
    STATE.epoch++;
    await api.post({action:"delete", table:tableName, key:keyValue});
    toast("Data berhasil dihapus","success");
    closeModal();
    try{ await loadTable(tableName); }
    catch(e){ toast("Terhapus, tetapi gagal menyegarkan data: "+e.message,"error"); }
    renderTableView(tableName);
  }catch(err){ toast("Gagal menghapus: "+err.message,"error"); }
}

function exportCSV(tableName){
  const table = SCHEMA.tables[tableName];
  const rows = STATE.allData[tableName]||[];
  if(!rows.length){ toast("Tidak ada data untuk diexport","error"); return; }
  const headers = table.fields.map(f=>f.label);
  const keys = table.fields.map(f=>f.name);
  const csv = [headers.join(",")].concat(rows.map(r=>keys.map(k=>csvEscape(r[k])).join(","))).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=tableName+".csv"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ==========================================================================
// LOGIN
// ==========================================================================
let pollingStarted = false;

function renderLoginScreen(mode){
  // mode: "loading" | "form" | "error"
  const body = mode==="loading" ? `
      <div class="login-loading"><div class="login-spinner"></div>Memuat data sistem...</div>` : mode==="error" ? `
      <div class="login-error show">Gagal memuat data dari Google Sheets. Periksa koneksi internet Anda.</div>
      <button class="btn btn-primary" id="loginRetryBtn" style="width:100%;justify-content:center;"><i data-lucide="refresh-cw"></i>Coba Lagi</button>` : `
      <div class="login-error" id="loginError"></div>
      <form id="loginForm" class="login-form">
        <div class="form-group full">
          <label>Username</label>
          <div class="login-field">
            <i data-lucide="user"></i>
            <input type="text" id="loginUsername" autocomplete="username" required/>
          </div>
        </div>
        <div class="form-group full">
          <label>Password</label>
          <div class="login-field">
            <i data-lucide="lock"></i>
            <input type="password" id="loginPassword" autocomplete="current-password" required/>
            <button type="button" class="pw-toggle" id="pwToggleBtn" tabindex="-1" aria-label="Tampilkan password"><i data-lucide="eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width:100%;justify-content:center;"><i data-lucide="log-in"></i>Masuk</button>
      </form>
      <div class="login-divider">atau</div>
      <button class="btn btn-ghost" id="viewOnlyBtn" style="width:100%;justify-content:center;"><i data-lucide="eye"></i>Masuk Hanya Lihat</button>`;

  $loginRoot.innerHTML = `
    <div class="login-overlay">
      <div class="glass login-card">
        <div class="login-card-band"></div>
        <div class="login-card-inner">
          <div class="login-logo"><img src="MSB Logo.png" alt="Logo MSB" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=MSB&background=2563EB&color=fff&bold=true';"/></div>
          <div class="login-title">QMS ISO 9001:2015</div>
          <div class="login-sub">PT Murinda Sentra Baja</div>
          ${body}
          <div class="login-foot">Sistem Manajemen Mutu Internal</div>
        </div>
      </div>
    </div>`;
  renderIcons();
  if(mode==="form"){
    document.getElementById("loginForm").addEventListener("submit", handleLoginSubmit);
    document.getElementById("viewOnlyBtn").addEventListener("click", enterViewOnly);
    const pwBtn = document.getElementById("pwToggleBtn");
    pwBtn.addEventListener("click", function(){
      const inp = document.getElementById("loginPassword");
      const showing = inp.type==="text";
      inp.type = showing ? "password" : "text";
      pwBtn.innerHTML = showing ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
      pwBtn.setAttribute("aria-label", showing ? "Tampilkan password" : "Sembunyikan password");
      renderIcons();
    });
    document.getElementById("loginUsername").focus();
  } else if(mode==="error"){
    document.getElementById("loginRetryBtn").addEventListener("click", retryInit);
  }
}
function showLoginError(msg){
  const el = document.getElementById("loginError");
  if(el){ el.textContent = msg; el.classList.add("show"); }
}
async function handleLoginSubmit(e){
  e.preventDefault();
  const u = document.getElementById("loginUsername").value.trim();
  const p = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginSubmitBtn");
  const originalHtml = btn.innerHTML;
  btn.disabled = true; btn.textContent = "Memeriksa...";
  try{
    let res;
    try{
      res = await api.post({action:"login", username:u, password:p});
    }catch(err){
      if(!/Action tidak dikenal/i.test(err.message)) throw err;
      /* Code.gs versi lama belum punya aksi login -> cek lokal dari sheet Login (cara lama) */
      const rows = STATE.allData.Login||[];
      const m = rows.find(r=>String(r.Username||"").trim().toLowerCase()===u.toLowerCase() && String(r.Password===undefined?"":r.Password)===p);
      if(!m) throw new Error("Username atau password salah.");
      res = {data:{username:m.Username, token:""}};
    }
    completeAuth(res.data.username, false, res.data.token||"");
  }catch(err){
    showLoginError(err.message);
    btn.disabled = false; btn.innerHTML = originalHtml; renderIcons();
  }
}
function enterViewOnly(){ completeAuth(null, true, ""); }
function completeAuth(username, viewOnly, token){
  STATE.authenticated = true;
  STATE.currentUser = username;
  STATE.viewOnly = viewOnly;
  STATE.token = token||"";
  sessionStorage.setItem("qms_user", username||"");
  sessionStorage.setItem("qms_viewonly", viewOnly?"1":"0");
  sessionStorage.setItem("qms_token", STATE.token);
  $loginRoot.innerHTML = "";
  renderSidebar();
  renderDashboard();
  renderUserMenu();
  if(!pollingStarted){ pollingStarted = true; setInterval(pollTick, CONFIG.POLL_MS); }
}
function logout(){
  STATE.authenticated = false;
  STATE.currentUser = null;
  STATE.viewOnly = false;
  STATE.token = "";
  sessionStorage.removeItem("qms_user");
  sessionStorage.removeItem("qms_viewonly");
  sessionStorage.removeItem("qms_token");
  renderLoginScreen("form");
}
function renderUserMenu(){
  const el = document.getElementById("userMenu");
  if(!el) return;
  if(STATE.viewOnly){
    el.innerHTML = '<span class="user-badge user-badge-view"><i data-lucide="eye"></i>Mode Hanya Lihat</span>'+
      '<button class="icon-btn" data-action="logout" title="Keluar"><i data-lucide="log-out"></i></button>';
  } else {
    el.innerHTML = '<span class="user-badge"><i data-lucide="user-round"></i>'+esc(STATE.currentUser||"")+'</span>'+
      '<button class="icon-btn" data-action="logout" title="Keluar"><i data-lucide="log-out"></i></button>';
  }
  renderIcons();
}
function retryInit(){
  renderLoginScreen("loading");
  loadAll(true).then(()=>{
    if(!STATE.lastSync){ renderLoginScreen("error"); return; }
    resumeAfterLoad();
  });
}
function resumeAfterLoad(){
  const savedUser = sessionStorage.getItem("qms_user");
  const savedViewOnly = sessionStorage.getItem("qms_viewonly");
  if(savedViewOnly==="1"){ completeAuth(null, true, ""); }
  else if(savedUser){ completeAuth(savedUser, false, sessionStorage.getItem("qms_token")||""); }
  else { renderLoginScreen("form"); }
}
